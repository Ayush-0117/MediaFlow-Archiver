spring.application.name=MediaflowArchiver

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/mediaflow_db
spring.datasource.username=mediaflow
spring.datasource.password=${DB_PASSWORD:mediaflow_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Tus / Upload limits for large videos
spring.servlet.multipart.max-file-size=5GB
spring.servlet.multipart.max-request-size=5GB

# Custom Archiver Configuration
archiver.rootroot.path=/home/ayush/Unified_Archive

# Gemini AI Configuration
# For local development, set the GEMINI_API_KEY environment variable:
#   Bash/Zsh:  export GEMINI_API_KEY=your_key_here  (add to ~/.bashrc or ~/.zshrc)
#   Fish:      set -Ux GEMINI_API_KEY your_key_here
#   Windows:   setx GEMINI_API_KEY "your_key_here"
# In production, the Tauri desktop wrapper injects this automatically.
gemini.api.key=${GEMINI_API_KEY:}

# CORS (lock this to your Tauri origin in production, e.g. tauri://localhost)
archiver.cors.allowed-origins=http://localhost:3000,tauri://localhost
