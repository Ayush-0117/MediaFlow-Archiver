<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaFlow Splash</title>
  <style>
    :root {
      --primary: #9d00ff;
      --bg: #09090b;
      --text: #e4e4e7;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      user-select: none;
    }
    .splash-container {
      background-color: var(--bg);
      border-radius: 16px;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 40px rgba(157, 0, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      /* Allow window dragging via Tauri */
      -webkit-app-region: drag;
    }
    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #9d00ff, #ff007f);
      border-radius: 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 30px rgba(157, 0, 255, 0.4);
      animation: pulse 2s infinite ease-in-out;
    }
    .logo svg {
      width: 40px;
      height: 40px;
      color: white;
    }
    .title {
      color: var(--text);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0 0 8px 0;
    }
    .subtitle {
      color: rgba(228, 228, 231, 0.6);
      font-size: 13px;
      font-weight: 500;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(157, 0, 255, 0.3);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 10px 30px rgba(157, 0, 255, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 10px 40px rgba(157, 0, 255, 0.6); }
      100% { transform: scale(1); box-shadow: 0 10px 30px rgba(157, 0, 255, 0.4); }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
      </svg>
    </div>
    <h1 class="title">MediaFlow Archiver</h1>
    <p class="subtitle">
      <span class="spinner"></span>
      Starting AI Engine...
    </p>
  </div>
</body>
</html>
